name: Publish to Docker Hub

on:
  pull_request:
  workflow_dispatch:
  release:
    types:
      - created

permissions:
  contents: read

jobs:
  docker-image-CI:
    name: Docker Image CI
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Only log in and push for releases. Pull requests and manual runs
      # just build the image to check that the Dockerfile works.
      - name: Log in to Docker Hub
        if: github.event_name == 'release'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and publish to Registry
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'release' }}
          tags: |
            clinicalgenomics/mutacc:latest
            clinicalgenomics/mutacc:${{ github.event.release.tag_name || 'test' }}
